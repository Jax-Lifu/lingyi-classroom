<!doctype html>
<html lang="zh-CN" data-storage-prefix="app:com.lingyi.classroom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (() => {
        const root = document.documentElement;
        let cache = {};
        try {
          const prefix = root.dataset.storagePrefix;
          const saved = localStorage.getItem(`${prefix}:theme-cache`) ??
            (prefix === "app:com.lingyi.classroom" ? localStorage.getItem("app:com.sensen.workbook:theme-cache") : null);
          cache = JSON.parse(saved ?? "{}") || {};
        } catch {}
        root.dataset.theme = ["light", "dark"].includes(cache.theme)
          ? cache.theme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.accent = ["blue", "green", "violet", "orange", "rose"].includes(cache.accent) ? cache.accent : "blue";
        root.dataset.fontSize = ["sm", "md", "lg"].includes(cache.fontSize) ? cache.fontSize : "md";
        root.dataset.reduceMotion = String(cache.reduceMotion === true);
      })();
    </script>
    <style>
      html { color-scheme: light; background: #faf8ef; color: #2a4738; }
      html[data-theme="dark"] { color-scheme: dark; background: #d8d2be; color: #1d3326; }
